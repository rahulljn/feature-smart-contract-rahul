spring:
  application:
    name: geojit-contract-note-api

  profiles:
    active: ${SPRING_PROFILE:local}

  # ─── JPA ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema, Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ─── Flyway ──────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── File Upload ─────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10GB
      max-request-size: 10GB

# ─── Server ──────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    include-message: always
    include-binding-errors: always

# ─── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Springdoc / Swagger ─────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ─── Application Custom Properties ───────────────────────────────────
app:
  jwt:
    private-key-path: classpath:keys/private.pem
    public-key-path: classpath:keys/public.pem
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000  # 7 days
    issuer: geojit-contract-note-api

  aws:
    region: ap-south-1
    s3:
      raw-bucket: raw-s3-geojit-prod
      chunks-bucket: chunks-s3-geojit-prod
      pdf-bucket: pdf-s3-geojit-prod
      report-bucket: geojit-report-files-s3-prod
      bounce-report-bucket: ${BOUNCE_REPORT_BUCKET:geojit-report-files-s3-dev}
      error-bucket: geojit-error-bucket-prod
      template-bucket: geojit-email-templates-dev
    sqs:
      pipeline-status-queue: geojit-pipeline-status-queue.fifo
      map-split-queue: geojit-map-split-processing-queue.fifo
      exceptions-queue-url: ${EXCEPTIONS_QUEUE_URL:}
    lambda:
      split-lambda: split-lambda-geojit
    presigned-url-expiry-hours: 168   # 7 days
    sns:
      ses-topic-arn: ${SNS_SES_TOPIC_ARN:arn:aws:sns:ap-south-1:021859069003:geojit-ses-notifications}
    cloudwatch:
      split-lambda-log-group:    ${CW_SPLIT_LOG_GROUP:/aws/lambda/split-lambda-geojit}
      invoke-lambda-log-group:   ${CW_INVOKE_LOG_GROUP:/aws/lambda/invoke-lambda-geojit}
      pdf-lambda-log-group:      ${CW_PDF_LOG_GROUP:/aws/lambda/create-pdf-geojit}
      json-lambda-log-group:     ${CW_JSON_LOG_GROUP:/aws/lambda/json-lambda-geojit}
      email-lambda-log-group:    ${CW_EMAIL_LOG_GROUP:/aws/lambda/email-notification-geojit}
      bounce-lambda-log-group:   ${CW_BOUNCE_LOG_GROUP:/aws/lambda/pull-bounce-geojit}
      delivery-lambda-log-group: ${CW_DELIVERY_LOG_GROUP:/aws/lambda/pull-delivery-geojit}
      status-consumer-log-group: ${CW_STATUS_CONSUMER_LOG_GROUP:/aws/lambda/status-consumer-geojit}

  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
